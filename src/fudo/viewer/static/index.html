<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fudo ビューア</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d21; color: #e6e6e6; font: 13px/1.5 sans-serif; }
  #app { display: flex; height: 100%; }
  #panel { width: 380px; flex: none; overflow-y: auto; padding: 12px; box-sizing: border-box; background: #24272c; }
  #view { flex: 1; position: relative; }
  #view canvas { display: block; }
  button { font: inherit; padding: 6px 12px; margin: 2px 4px 2px 0; cursor: pointer; }
  input[type=text] { font: inherit; width: 190px; padding: 5px; }
  pre { white-space: pre-wrap; font: inherit; background: #1e2125; padding: 8px; margin: 8px 0; }
  #status { color: #9fc5ff; min-height: 1.5em; }
  #cell { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); padding: 6px 8px; white-space: pre; }
  #time { font-size: 15px; font-weight: bold; white-space: pre-line; }
  input[type=range] { width: 100%; }
  h2 { font-size: 14px; margin: 14px 0 4px; }
</style>
<script type="importmap">
  { "imports": { "three": "/static/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app">
  <div id="panel">
    <div>
      シード <input id="seed" type="text" placeholder="空欄ならランダム">
      <button id="gen">マップを生成</button>
    </div>
    <div><button id="sim" disabled>シミュレート開始</button></div>
    <div id="status"></div>
    <h2>今回の世界</h2>
    <pre id="desc">まだ生成していません。</pre>
    <h2>再生</h2>
    <div id="time">—</div>
    <input id="slider" type="range" min="0" max="0" value="0" disabled>
    <div>
      <button id="play" disabled>再生</button>
      速度 <input id="speed" type="text" size="3"> 月/秒
      <span id="progress"></span>
    </div>
    <div id="legend">建物の色：<span style="color:#e8e0d0">■</span>家　<span style="color:#7fa7d9">■</span>鉱山で働く人の家　<span style="color:#e05a4a">■</span>店　<span style="color:#f0a030">■</span>宿・茶屋　<span style="color:#333">■</span>鉱山（坑口）</div>
  </div>
  <div id="view"><div id="cell"></div></div>
</div>
<script type="module" src="/static/main.js"></script>
</body>
</html>
