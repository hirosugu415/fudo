# 物理法則（SPEC 第5章）。画面には出さず、この既定値で固定する。世界シードとは別に管理する。
# 別の物理法則で比べるときは、このファイルを複製して書き換え、`fudo run --physics <パス>` で指定する。
# run_id にはこのファイルの内容のハッシュが入る（world_id には入らない）。
#
# フェーズ1では読み込みとハッシュの仕組みだけを用意する。法則の中身（第5.2章の一覧）はフェーズ5で埋める。
# 各法則は次の形式で書く（第5.1章）：
#   <名前>:
#     initial: <明治時点の水準 0〜1>
#     limit: <理論限界>
#     difficulty: <進みにくさ>
#     requires: {<法則>: <水準>}
#     side_effects: {...}
