# 分析・検証（SPEC 第14章）の定義。シミュレーションの結果には影響しない（どのハッシュにも入らない）。

settlement:
  dense_households: 4         # 世帯/マス。これ以上の世帯が住むマスを「集落の中心部」とみなす
  # 集落 = 中心部のマスが8近傍でつながったまとまり。人口はその中のマスの合計
rank_size:
  min_settlements: 5          # 個。順位と規模の関係を調べるのに要る集落の数
  top_n: 20                   # 個。上位いくつの集落で傾きを測るか
  slope_range: [-2.0, -0.5]   # 順位と規模の両対数の傾きの範囲（Zipf の法則では −1 前後）
market_towns:
  river_discharge_m3s: 2.0    # m³/s。合流点・渡し場を調べる川
  tributary_discharge_m3s: 0.5   # m³/s。合流点とみなす支流の流量
  pass_climb_m: 150.0         # m。この半径の中でこれ以上登る、平らな道のマスを「峠のふもと」とみなす
  pass_radius_km: 2.0
  foot_max_slope: 0.05        # 「ふもと」とみなすマス自身の勾配の上限（斜面の途中の道を除く）
  near_km: 0.5                # km。この距離以内を「近く」とみなす
  min_ratio: 1.2              # 店が地点の近くにある割合 ÷ 世帯が地点の近くにある割合 の下限（地点の種類ごとに判定する）
  min_households_near: 200    # 世帯。地点の近くに住む世帯がこれより少ない種類は、店の数が少なすぎて判定できないので数えない（2026-10-28：合流点の近くが数十世帯で、店0軒で落ちたため）
fertile_plains:
  min_ratio: 2.0              # 条件の良い上位4分の1のマスの農地の割合 ÷ 下位4分の1の農地の割合 の下限
land_price:
  radius_km: 1.0              # km。最も大きい集落の中心から、この範囲の住んでいるマスで調べる。1870年の最大の集落は人口300人ほどの村で、3km では隣の村の地価の山を拾うため1km にした（2026-10-28。中心から1km では上位3集落とも順位相関 −0.65〜−0.9）
  max_correlation: -0.2       # 中心からの距離と地価の順位相関の上限（負なら離れるほど安い）
mining_town:
  # 鉱山の周りに町ができ、枯渇すると人口が減る（フェーズ3）
  radius_km: 2.0              # km。坑口からこの範囲の世帯数を鉱山町の大きさとみなす（片道45分の通勤の範囲の目安）
  growth_years: 10            # 年。開いてからこの年数の後の世帯数を、開いたときと比べる
  min_growth_ratio: 1.5       # (鉱山の周りの世帯数の増え方) ÷ (マップ全体の世帯数の増え方) の下限
  decline_years: 10           # 年。閉山からこの年数の後の世帯数を、閉山の前の最大と比べる
  min_decline: 0.2            # 閉山の前の最大から減った割合の下限
