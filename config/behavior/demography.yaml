# 人口の動き（SPEC 9.1）。既定値は江戸後期〜明治初期の農村の歴史人口学の知見に基づく推定。

max_members: 10               # 人。1世帯の構成員の上限（配列の大きさ）

death:
  # 年齢区間の下限 [歳] と、その区間の1年あたりの死亡確率。
  # 根拠：江戸後期の宗門人別改帳の分析（速水融ほか）から読み取った大まかな値（推定）。乳児死亡が高く、平均寿命は30代
  age_lower: [0, 1, 5, 15, 50, 60, 70]
  prob_per_year: [0.20, 0.03, 0.006, 0.010, 0.020, 0.045, 0.12]
  famine_multiplier_per_shortfall: 4.0   # 食料が必要量に対して不足した割合 1 あたりの、死亡確率の倍率の増え方。推定：凶作の年は死亡率が数倍になった

birth:
  min_age: 18                 # 歳
  max_age: 44                 # 歳
  per_adult_per_year: 0.09    # 1/年。この年齢の構成員1人あたりの出生確率。根拠：江戸後期の農村の合計特殊出生率 約5（推定）÷ 27年 ÷ 2
  famine_multiplier: 0.5      # 食料が不足した年の出生率の倍率。推定

household_formation:
  # 跡継ぎ以外の若者が独立して新しい世帯をつくる（新しい世帯の住む場所は、本人がロジットで選ぶ）
  min_age: 18                 # 歳
  max_age: 30                 # 歳
  prob_per_year: 0.3          # 1/年。推定
  min_members_to_leave: 3     # 人。これより少ない世帯からは独立しない（親世帯が成り立たなくなるため）。推定
  pair_up: true               # 同じ年に独立する若者どうしで、2人の世帯をつくる（結婚）
  money_share_from_parent: 0.1   # 独立するとき親の世帯から持っていく蓄えの割合。推定

migrant_household:
  # 外から移住してくる世帯の構成。各年齢に、世帯ごとに一様乱数で −spread〜+spread 歳のずれを加える
  ages: [30, 27, 8, 5, 2]     # 歳。推定：夫婦と子3人
  spread_years: 4
