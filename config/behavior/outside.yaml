# 外部世界の仮の値（フェーズ3で外部世界モデルに置き換える。ユーザー合意）。
# 金額の単位「円」は明治初期の円。外部の大都市がつながる地点で、この価格で取引できる。

prices:
  rice_yen_per_kg: 0.04       # 円/kg（玄米）。根拠：明治初期の米価は1石（約150kg）あたり約5〜7円（推定）
  fish_yen_per_kg: 0.05       # 円/kg。推定：同じ重さの米よりやや高い
wage_yen_per_day: 0.15        # 円/日。外部の日雇い賃金。根拠：明治初期の日雇い・大工の日当 0.1〜0.3円（推定）
work_hours_per_day: 10.0      # 時間/日。移動時間をお金に換算するとき、時間の価値 = 日当 ÷ この値
interest_rate_per_year: 0.08  # 1/年。地価 = 年間の地代 ÷ 金利。根拠：明治初期の金利 8〜12%（推定）

outside_household:
  # 外にとどまる世帯の暮らし（入植するか、出ていくかの比較の基準）
  income_yen_per_year: 45.0   # 円/年。推定：日雇い 0.15円 × 250日 × 働き手1.2人
  money_yen: 10.0             # 円。移住してくる世帯が持ってくる蓄え。推定：数か月分の暮らし

migration:
  potential_households_per_year_per_100k: 40.0   # 世帯/年。接続点1つあたり、外部の大都市の人口10万人あたりの「移住を考える世帯」の数。推定
  moving_cost_utility: 0.3    # 効用の単位。マップに入る・出るときの心理的・金銭的な費用。推定
