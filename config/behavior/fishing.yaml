# 漁業（フェーズ2では世帯の家業。漁村ができるように。ユーザー合意）。
# 漁獲 [kg/年] = catchability × 働き手の数 × 資源量の密度（Schaefer モデル）。資源量は world の漁場の上限と回復速度でロジスティックに回復する。

catch_per_adult_at_capacity_kg: 1500.0   # kg/人/年。資源が上限まであるときの、働き手1人の年間の漁獲。推定：近世の沿岸漁村
fishing_radius_km: 2.0        # km。家から漁に出られる範囲
min_fishery_cells: 3          # マス。範囲内の漁場がこれより少なければ漁業を選べない
