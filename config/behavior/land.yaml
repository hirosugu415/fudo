# 土地市場（SPEC 10）。各マスは最も高い地代を払う用途に使われる。地価 = 年間の地代 ÷ 金利（outside.yaml）。

residential_rent:
  # 住む場所の地代 [円/世帯/年] は、住みたい世帯の多さで毎年調整する（付け値地代）。
  # 新しい地代 = 地代 × exp(adjust_rate × (住んでいる世帯数 / 上限 − target_occupancy))、下限は floor_yen
  initial_yen: 0.2
  adjust_rate: 0.6            # 1/年。推定
  target_occupancy: 0.5       # 推定
  floor_yen: 0.05             # 円/世帯/年。推定
  max_yen: 30.0               # 円/世帯/年。数値が発散しないための上限（数値上の値）
  # 付け値地代（Alonso）：便利なマス（店への近さ・近所の多さ・洪水の起きにくさ）ほど、世帯は高い地代を払ってでも住みたい。
  # 住んでいるマスのうち便利さが下から fringe_quantile のマス（町外れ）を地代0の基準にして、
  # 便利さの差 ΔU を、効用が同じになる地代に換算する：付け値 = 所得の中央値 × (1 − exp(−ΔU / 所得の重み))
  # （効用の所得の項は ln(所得 − 地代) なので、この地代を払うと、町外れに住むのと効用が同じになる）
  # 地代は毎年、付け値に bid_adjust_rate の速さで近づき、さらに上の混み具合の調整を受ける
  bid_fringe_quantile: 0.2    # 無次元。推定
  bid_adjust_rate_per_year: 0.3   # 1/年。推定
