# 世界の枠組み：格子・緯度・海の配置・風。
# この設定と世界シードから世界が決まる（world_id に含まれる）。画面からは操作しない。

grid:
  nx: 256                 # マス数（東西）。SPEC 第3章
  ny: 256                 # マス数（南北）。SPEC 第3章
  cell_size_m: 100.0      # m。1マスの一辺。SPEC 第3章

latitude_deg:             # 度（北緯）。生成する世界の緯度の範囲。一様分布で選ぶ
  min: 25.0               # ユーザー合意：温帯の日本的な範囲（およそ25〜45度）
  max: 45.0

sea_level_m: 0.0          # m。海面の標高。基準なので0

sea_edges:
  # 海に面するマップ端の数（0, 1, 2）の確率。0なら内陸の盆地。
  # 推定：日本の25km四方は沿岸を含むことが多いが、盆地もあるため、0を少なめに残す。
  count_probabilities: [0.25, 0.5, 0.25]
  # 2辺が海のとき、隣り合う2辺（岬・角）になる確率。残りは向かい合う2辺（地峡）。
  # 推定：地峡は日本では少ない。
  adjacent_probability: 0.85

wind:
  # 地表付近の風。月ごとの風 ＝ 偏西風成分 ＋ 季節風成分 × 季節の重み。
  westerly_speed_ms:      # m/s。偏西風の東向き成分の強さ（緯度で重み付けする前）。推定：中緯度の地上風の平均 2〜6 m/s
    min: 2.0
    max: 6.0
  westerly_lat_ramp_deg:  # 度。この緯度の範囲で偏西風の重みが0→1に増える。推定：亜熱帯高圧帯（〜25度）から偏西風帯（〜40度）
    from: 25.0
    to: 40.0
  monsoon_speed_ms:       # m/s。季節風の強さ。推定：東アジアの冬・夏の季節風の地上風速 2〜7 m/s
    min: 2.0
    max: 7.0
  monsoon_summer_from_deg: # 度（北=0、時計回り）。夏の季節風が吹いてくる方位。冬は反対向き（北西〜北北東）。
    min: 120.0             # 根拠：日本の夏の季節風は南東〜南南西から吹く（ユーザー合意で制限）。海の位置はランダムなので、
    max: 200.0             #       北が海の世界は冬の季節風が海を渡って雪国（日本海側型）になる
  monsoon_peak_month: 7.5 # 月（1〜12、小数可）。夏の季節風が最も強い時期。推定：東アジアでは7〜8月
  min_speed_ms: 1.0       # m/s。風速の下限。0だと水蒸気の移流の式が成り立たないため。推定
