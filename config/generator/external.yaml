# 外部世界の性質（SPEC 第4.6章）。動き（第8章）はフェーズ3。

composition:
  # 外部世界の地形構成（山地・平地・島の割合）。ディリクレ分布の集中度パラメーター（無次元）。
  # 順番は [山地, 平地, 島]。推定：日本的な世界として山地をやや多く、島を少なめにする。
  dirichlet_alpha: [3.0, 2.0, 1.0]

edges:
  # 陸のマップ端の外側の地形。山地になる確率は 山地/(山地+平地) の割合に従う（外部の地形構成と矛盾させないため）。
  mountain_outer_elevation_m:   # m。外側の山地の標高。外から流れ込む川の流域の平均標高の基準に使う（端の標高は固定しない）。推定：日本の中山地の稜線 300〜900 m
    min: 300.0
    max: 900.0
  plain_outer_elevation_m:      # m。外側が平地の端の標高（浸食計算の固定境界）。推定：沖積平野・台地 5〜60 m
    min: 5.0
    max: 60.0
  mountain_edge_uplift_boost: 0.5  # 無次元。山地の端に近い隆起域の隆起量を (1 + この値 × e^(−距離/下の長さ)) 倍にする。外側の山が内側に続くようにするため。隆起しない低地は持ち上げない。推定
  mountain_edge_boost_length_km: 4.0  # km。上の増分が e 分の1 になる距離。推定
  outlet_gorge_width_cells: 3   # マス。どの端も開いていない（全部山地で海もない）とき、山地の端の1か所に作る出口（峡谷）の幅。推定
  outer_sea_distance_km:        # km。陸の端の外側から海までの距離。対数正規分布
    median: 80.0                # 推定：日本の内陸の地点から海までの距離は数十〜150 km 程度
    log_sd: 0.6
  island_distance_shortening: 0.8  # 無次元。島の割合 f のとき、外側の海までの距離に (1 − この値 × f) を掛ける。島が多いほど海が近い。推定

connections:
  # 外部の大都市がつながる地点。候補：外から流れ込む川の上流（river）、海の端（sea）、山地の端の最も低い鞍部（pass）、平地の端（plain）。
  count:                        # 個。外部の大都市の数（一様な整数）。推定
    min: 1
    max: 3
  kind_weights:                 # 無次元。候補の種類ごとの選ばれやすさ。推定：川の上流と海は昔から大都市につながりやすい
    river: 3.0
    sea: 3.0
    pass: 1.0
    plain: 2.0
  city_population:              # 人。外部の大都市の初期人口。対数正規分布
    median: 150000.0            # 推定：明治初期の地方の大都市（城下町・港町）は数万〜数十万人
    log_sd: 0.8

traits:
  population_growth_per_year:   # 1/年。外部世界の人口成長率の傾向。一様分布。推定：19〜20世紀の世界の人口成長率 0.3〜1.5 %/年
    min: 0.003
    max: 0.015
  business_cycle_amplitude:     # 無次元。景気変動の大きさ（産出量のトレンドからの乖離の標準偏差）。推定：先進国の景気循環で 1〜5 %
    min: 0.01
    max: 0.05
