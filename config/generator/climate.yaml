# 気候（SPEC 第4.3章）。

temperature:
  # 海面での年平均気温 = at_lat_35_c + per_deg_lat_c × (緯度 − 35)
  # 根拠：気象庁の平年値（1991〜2020年）の沿岸観測所（那覇 約23℃・鹿児島 約19℃・東京 約16℃・仙台 約13℃・札幌 約9℃）を緯度で目分量で回帰した推定値
  annual_mean:
    at_lat_35_c: 16.0         # ℃
    per_deg_lat_c: -0.85      # ℃/度
  # 年較差の半分（最暖月と最寒月の月平均気温の差 ÷ 2）= at_lat_35_c + per_deg_lat_c × (緯度 − 35)
  # 根拠：上と同じ観測所（那覇 約6℃・東京 約11℃・札幌 約13℃）からの推定
  half_annual_range:
    at_lat_35_c: 10.0         # ℃
    per_deg_lat_c: 0.4        # ℃/度
  warmest_month: 7.6          # 月（1〜12、小数可）。最暖月の中心。根拠：日本の多くの地点で8月上旬が最も暑い
  continentality:
    extra_half_range_c: 2.5   # ℃。海から十分遠いときの、年較差の半分の増分。推定：長野（内陸）と沿岸の年較差の差 5〜7℃ の半分
    mean_shift_c: -2.0        # ℃。海から十分遠いときの、年平均気温の変化。推定：那覇（沿岸の島）と同緯度の大陸沿岸（福州）の年平均気温の差 約3℃ を緩めた値
    length_km: 60.0           # km。海からの距離でこの増分が (1 − e⁻¹) に達する距離。推定
  lapse_rate_c_per_km: 6.5    # ℃/km。気温減率。根拠：国際標準大気

sea_surface:
  mean_offset_c: 1.5          # ℃。海面水温の年平均 − 海面での気温の年平均。推定：日本近海は海のほうがやや暖かい
  amplitude_ratio: 0.6        # 無次元。海面水温の年較差 ÷ 気温の年較差。推定：海は熱容量が大きく季節変化が小さい
  lag_months: 1.0             # 月。海面水温の季節変化の、気温に対する遅れ。推定：日本近海の海面水温は8月下旬〜9月が最高

saturation_vapor:
  # 飽和水蒸気圧 e_s [hPa] = a × exp(b × T / (T + c))、T は ℃。根拠：Tetens 式（Murray 1967 の係数）
  a_hpa: 6.108
  b: 17.27
  c_c: 237.3

moisture:
  precipitable_water_ref_mm: 45.0   # mm。基準気温での可降水量。根拠：日本の夏の可降水量 40〜50 mm（推定）
  reference_temp_c: 25.0            # ℃。上の値の基準気温。可降水量は飽和水蒸気圧に比例するとみなす（Clausius-Clapeyron）
  land_decay_km: 400.0              # km。外側の陸を渡る間に、入ってくる空気の水蒸気が e 分の1 になる距離。推定
  mountain_edge_factor:             # 無次元。外側が山地の端から入る空気は、山を越えるときに乾く。その倍率（世界ごと・端ごとに一様分布）。推定：雨陰の効果
    min: 0.45
    max: 0.75
  edge_log_sd: 0.1                  # 無次元。端ごとの湿り気のばらつき（対数正規分布の標準偏差）。推定
  sea_relaxation_km: 150.0          # km。海の上で、水蒸気が海面水温に見合う量へ e 分の1 に近づく距離。推定

precipitation:
  # 月降水量 [mm] = 水蒸気量 q [mm] × 風速 [m/s] × φ ÷ L × 月の秒数
  # φ = (1 + orographic_gain × 風上の勾配) × max(lee_floor, 1 − lee_suppression × 風下の勾配)
  rainout_length_km: 2200.0         # km（= L）。平地の上で水蒸気が降水で e 分の1 になる距離。推定：日本の平地の年降水量 1200〜2500 mm になるよう見積もった値
  orographic_gain: 25.0             # 無次元。風上の斜面の勾配1あたりの降水効率の増え方。推定：勾配0.1の斜面で降水が約3.5倍（日本の山地の風上側の多雨）
  lee_suppression: 5.0              # 無次元。風下の斜面の勾配1あたりの降水効率の減り方（下降気流による昇温・乾燥）。推定
  lee_floor: 0.5                    # 無次元。風下での降水効率の下限。推定：日本の山地の風下側でも平地の半分程度は降る
  orographic_max_factor: 3.0        # 無次元。風上の斜面での降水効率の上限。推定：日本の山地の風上側の年降水量は平地の2〜4倍程度（例：大台ヶ原・屋久島で 4000〜8000 mm）
  slope_smoothing_cells: 5          # マス。地形性降雨に使う勾配を平滑化する半径。雲の中で雨粒ができるまでの距離（数百m）の分だけ、細かい凹凸を無視するため。推定
  snow_threshold_c: 1.0             # ℃。月平均気温がこれ未満なら降水は雪になる。根拠：雨と雪の境界はおよそ0〜2℃（推定）

rain_systems:
  # 季節風の向きによらず降る雨（梅雨前線・台風・夕立）。月降水量に加える（ユーザー合意）。
  # 前線と台風の量は世界ごとに一様分布で選ぶ。緯度が高いほど弱まる（緯度 lat_full_deg まで全量、lat_zero_deg で0）。
  baiu:
    amount_mm:                # mm。最盛期の月降水量への上乗せ。根拠：日本の多くの地点で6〜7月の降水量は4〜5月より 80〜200 mm 多い（推定）
      min: 80.0
      max: 200.0
    peak_month: 6.6           # 月（1〜12、小数可）。根拠：梅雨の最盛期は6月下旬〜7月上旬
    width_months: 0.7         # 月。季節変化の幅（ガウス形の標準偏差）。推定：梅雨の期間 約1か月半
    lat_full_deg: 36.0        # 度。推定：本州中部まで梅雨前線の雨が十分にある
    lat_zero_deg: 43.0        # 度。根拠：北海道には梅雨がほとんどない
  typhoon:
    amount_mm:                # mm。最盛期の月降水量への上乗せ。根拠：台風期（8〜9月）の太平洋側の月降水量は 60〜250 mm 増える（推定）
      min: 60.0
      max: 220.0
    peak_month: 8.9           # 月。根拠：台風の接近は9月上旬が多い
    width_months: 0.9         # 月。推定
    lat_full_deg: 30.0        # 度。推定：南西諸島〜九州南部は台風の雨が最も多い
    lat_zero_deg: 46.0        # 度。推定：北海道北部ではまれ
  convective:
    mm_per_c: 5.0             # mm/(℃·月)。月平均気温が base_c を超える1℃あたりの夕立などの月降水量。推定：夏の日本の雷雨の寄与
    base_c: 18.0              # ℃。推定：これより涼しい月は夕立がほとんどない
  orographic_per_km: 0.6      # 1/km。向きによらない雨の、標高1kmあたりの増加の割合。推定：台風や前線の雨も山地で多い

evapotranspiration:
  # Hamon 法：可能蒸発散量 [mm/日] = coefficient × hamon_constant × (日の長さ[時間] / 12) × 飽和水蒸気密度 [g/m³]
  # 飽和水蒸気密度 = 216.7 × e_s / (T + 273.3)
  # 根拠：Hamon (1963)、係数は Lu et al. (2005) の補正 1.2
  coefficient: 1.2
  hamon_constant: 0.1651
  vapor_density_factor: 216.7       # g·K/(m³·hPa)。水蒸気の状態方程式からの係数
  vapor_density_offset_c: 273.3     # ℃→K の換算（Hamon の原式の値）
  obliquity_deg: 23.44              # 度。地軸の傾き（日の長さの計算）
  declination_day_offset: 284       # 日。赤緯の近似式 δ = 傾き × sin(2π(284 + 年間通日)/365) の定数（Cooper 1969）

anomaly:
  # 年ごとの気温と降水のゆらぎ（AR(1)過程）。固定の起点の年から生成する（ユーザー合意）。
  origin_year: 1700                 # 年。ウォームアップ期間の長さを変えても、同じシードなら同じ年の気候が同じになるための起点
  temperature_sd_c: 0.5             # ℃。年平均気温の年々変動の標準偏差。推定：日本の観測所の年平均気温の年々の標準偏差 0.4〜0.6℃
  temperature_ar1: 0.3              # 無次元。前の年との相関。推定
  precipitation_log_sd: 0.12        # 無次元。年降水量の倍率の対数の標準偏差。推定：日本の年降水量の変動係数 10〜15 %
  precipitation_ar1: 0.1            # 無次元。前の年との相関。推定
