# 水系（SPEC 第4.2章）。

flat_routing_jitter: 4.0          # 無次元。地形ができた後の水系計算で、平らな面に付ける数値上の傾きを (1 + この値 × 一様乱数) 倍にばらつかせる。
                                  # 平らな面（埋まった盆地・海岸平野）の流路が出口へ向かう直線にならないようにするための数値上の値。推定
lake_min_depth_m: 1.0             # m。窪地を埋めたときの深さがこれを超えるマスを湖とする。推定
river_min_discharge_m3s: 0.3      # m³/s。年平均流量がこれを超えるマスを川とする（説明・表示・漁場に使う）。推定：日本の小河川の平水流量

soil:
  capacity_mm: 150.0              # mm。土壌に保持できる水の量。推定：日本の森林土壌の有効水分量 100〜200 mm

groundwater:
  infiltration_fraction: 0.4      # 無次元。土壌からあふれた水のうち地下に浸透する割合。推定
  residence_days: 60.0            # 日。地下水の線形貯留の時定数（基底流量 = 地下水量 / 時定数）。推定：日本の山地流域の基底流の減衰の時定数 数十日〜数か月

snow:
  degree_day_mm_per_c_day: 4.0    # mm/(℃·日)。融雪の度日係数。根拠：Hock (2003) の雪の度日係数 2.5〜6
  melt_threshold_c: 0.0           # ℃。この気温を超えた分だけ融ける

inflow:
  # マップの外から流れ込む川（外側が山地の端からだけ入る。平地の端は境界が開いていて、入った川がすぐ出てしまうため）。
  per_mountain_edge_mean: 0.7     # 個。山地の端1辺あたりの流入する川の数の平均（ポアソン分布）。推定
  area_km2:                       # km²。外側の集水面積。対数正規分布
    median: 150.0                 # 推定：25km四方に外から入ってくる川の流域
    log_sd: 1.0
    max: 3000.0                   # km²。上限。推定
  mean_elevation_above_edge_m:    # m。外側の集水域の平均標高の、その端の標高からの上乗せ。一様分布。推定
    min: 100.0
    max: 600.0
  sediment_yield_mm_per_yr: 0.3   # mm/年。外側の集水域から運ばれてくる土砂の量（流域の平均の削剥速度）。推定：日本の山地の削剥速度 0.1〜1 mm/年
  min_spacing_cells: 30           # マス。流入点どうしの最小の間隔。推定
  edge_margin_cells: 20           # マス。流入点をマップの角から離す距離。推定

spinup_years: 6                   # 年。生成時に平年値の気候で水収支を回す年数。初期の積雪・土壌・地下水と年平均流量を作る。推定：地下水の時定数（数か月）の数倍
