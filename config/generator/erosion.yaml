# 隆起・浸食・堆積による地形の生成（SPEC 第4.1章）。
# 式：dz/dt = U − K·Q^m·S + (G/Q)·Qs + D·∇²z   （Yuan et al. 2019 の堆積付き stream power 則、n = 1）
#   U  ：隆起速度 [m/年]
#   K  ：下刻の係数 [1/年]（m = 0.5 のとき。K_base × 岩石の倍率）
#   Q  ：流出量で重みを付けた集水面積 [m²]（各マスの面積 × 相対流出量 の上流の合計）
#   S  ：流向に沿った勾配 [無次元]
#   G  ：堆積の係数 [無次元]
#   Qs ：上流から流れ込む土砂の量 [m³/年]
#   D  ：斜面の拡散係数 [m²/年]
# 解法：Braun & Willett (2013) の陰解法を、Qs について Gauss-Seidel 型の反復で堆積付きに拡張したもの（Yuan et al. 2019）。
# 斜面の拡散は陰解法で解く。海に入った土砂は沖へ運ばれるとみなす。

initial_relief_m: 20.0        # m。初期の地表の凹凸（ノイズの振幅）。流路が決まるきっかけ。推定

uplift:
  max_mm_per_yr:              # mm/年。最大隆起速度（世界ごとに一様分布で選ぶ）。根拠：日本の山地の隆起速度 0.5〜3 mm/年（藤原ほか 2004 などの推定の範囲）
    min: 0.6
    max: 1.6
  lowland_fraction:           # 無次元。隆起しない低地（盆地・平野の素）の面積の割合。世界ごとに一様分布で選ぶ。推定
    min: 0.15
    max: 0.45
  basin_subsidence_mm_per_yr: # mm/年。低地の中で最も沈むところの沈降速度（低地の縁で0、ノイズの最も低いところで最大）。世界ごとに一様分布
    min: 0.05                 # 根拠：濃尾平野・大阪平野・関東平野などの沈降盆地の長期の沈降速度 0.1〜1 mm/年（推定の範囲）
    max: 0.6
  basin_fill_ratio: 0.08       # 無次元。沈降でできる空きの体積が、隆起する山地から出る土砂の体積のこの割合を超えないように沈降の速さを抑える。
                              # 土砂の一部は海やマップ外へ出るので1より十分小さくする（盆地が湖ばかりにならないため。ユーザー指定の方針）。推定
  noise_scale_km: 14.0        # km。隆起の分布の基本の波長。推定：日本の山地・盆地の並びの大きさ 10〜20 km
  octaves: 4                  # 個
  persistence: 0.5            # 無次元
  coastal_subsidence_mm_per_yr: 0.3   # mm/年。海の端の近くでの沈降速度。海岸の低地と浅い海ができるため。推定：沈降性の平野で 0.1〜1 mm/年
  coastal_subsidence_length_km: 6.0   # km。沈降が e 分の1 になる、海の端からの距離。外洋の帯（open_sea_band_km）より内側にも沈降域が残り、土砂で埋まって海岸平野になる。推定
  basin_trap_fraction: 0.8    # 無次元。沈む場所（沈降盆地・海岸の沈降域）が海に沈んだ部分（湾）に流れ込んだ土砂のうち、湾を埋める割合。残り（細かい浮遊土砂）は沖へ。推定：内湾は土砂の大部分をためる
  open_sea_band_km: 3.0       # km。海の端からこの距離までの海は外洋に面しているとみなし、土砂は沖へ運ばれる（湾として埋めない）。推定：波浪で土砂が沖へ運ばれる沿岸の幅

stream_power:
  K_base_per_yr: 8.0e-6       # 1/年（m = 0.5）。推定：Stock & Montgomery (1999) などの 10⁻⁷〜10⁻⁵ の範囲で、25km四方の起伏が日本の中山地程度（数百〜2000 m）になる値
  m: 0.5                      # 無次元。集水面積の指数。根拠：m/n ≈ 0.5（Whipple & Tucker 1999 など）
  G: 1.0                      # 無次元。堆積の係数。根拠：Yuan et al. (2019) が検討した範囲（0〜数）の中間。推定

hillslope:
  D_m2_per_yr: 0.01           # m²/年。斜面の拡散係数。根拠：Fernandes & Dietrich (1997) などの 10⁻³〜10⁻² の上限側（降水の多い日本）
  critical_angle_deg: 35.0    # 度。臨界勾配。隣のマスとの勾配がこれを超えると斜面が崩れる。根拠：隆起の速い山地の斜面は 30〜40° で頭打ちになる（Montgomery 2001、Roering et al. 1999 などの推定の範囲）
  collapse_max_iterations: 100  # 回。崩壊の計算の繰り返しの上限（数値上の値）
  collapse_tolerance_m: 0.01  # m。臨界勾配を超える量がこれ以下になったら崩壊の計算を終える（数値上の値）

routing:
  # 浸食の計算中の流れ先：下り方向の近傍から、勾配の slope_exponent 乗に比例する確率で毎時間刻み選び直す（シードで決定的）。
  # 時間平均で多方向流になり、D8 の直線的な川や平行な筋を減らす。地形ができた後の水系（シミュレーションで使う）は最急降下の D8。
  slope_exponent: 1.1         # 無次元。根拠：Freeman (1991) の多方向流の指数

time:
  dt_yr: 10000.0              # 年。浸食計算の時間刻み。下刻・拡散とも陰解法なので安定
  total_yr: 3.0e6             # 年。計算する期間。推定：K と U から見積もった定常に近づくまでの時間（K·Q^m の逆数の数倍）
  climate_update_every_steps: 50   # 回。この回数ごとに気候の平年値を計算し直し、相対流出量と下刻の係数に反映する（地形と気候の交互計算）

sea_level_history:
  # 300万年の浸食（海面は frame.yaml の sea_level_m）の後に、最終氷期の低海面期と完新世を計算する（ユーザー合意）。
  # 日本の沖積平野の多くは、低海面期に刻まれた谷が海面上昇で沈み、その後の約7000年で川の土砂に埋められてできた。
  lowstand:
    sea_level_offset_m: -120.0    # m。海面の低下量。根拠：最終氷期最盛期の海面低下 約120〜130 m（Lambeck et al. 2014）
    duration_yr: 30000.0          # 年。根拠：海面が大きく下がっていた期間（およそ3万〜2万年前、Clark et al. 2009）を丸めた推定
    dt_yr: 2000.0                 # 年
  holocene:
    duration_yr: 7000.0           # 年。根拠：海面がほぼ現在の高さに達した約7000年前（縄文海進の最盛期）から現在まで
    dt_yr: 500.0                  # 年
    marine_trap_fraction: 0.5     # 無次元。河口に届いた土砂のうち、三角州・溺れ谷を海面の高さまで埋める割合。残り（細かい浮遊土砂）は沖へ運ばれる。推定
    max_spread_km: 6.0            # km。1つの時間刻みで、河口から土砂が広がって埋める距離の上限。これを超える分は沖へ運ばれる。推定

floodplain:
  # 浸食計算の後、沖積層の上にだけ加える微起伏（自然堤防と後背湿地）。平らに埋まった面で川が直線にならず、微地形に沿って曲がる。
  micro_relief_m: 0.6           # m。微起伏の振幅。根拠：沖積平野の自然堤防と後背湿地の比高 1〜3 m（推定）。窪地が湖と判定されないよう（hydrology.yaml の lake_min_depth_m）下限側を採る
  scale_km: 0.8                 # km。微起伏の最も大きい波長。推定：自然堤防の帯・旧河道の幅〜蛇行の波長
  octaves: 3                    # 個
  persistence: 0.5              # 無次元
  min_height_above_sea_m: 0.2   # m。微起伏で海面より下がらないようにする下限。推定

sediment_iteration:
  max_iterations: 20          # 回。各時間刻みで Qs を収束させる反復の上限
  tolerance_m: 0.01           # m。標高の変化がこれより小さくなったら収束とみなす

numerics:
  lake_trap_min_depth_m: 0.5  # m。窪地の深さがこれを超えるマスを、浸食計算の中で湖（土砂の受け皿）として扱う。平らな面の数値上の傾き（fill_epsilon_m）と区別するための値。推定
  fill_epsilon_m: 1.0e-4      # m。窪地埋めで平らな面に付ける最小の傾き。流向を決めるための数値上の値（Barnes et al. 2014 の Priority-Flood+ε）
  min_relative_runoff: 0.05   # 無次元。相対流出量の下限。乾いたマスで Q が0になり式が成り立たなくなるのを防ぐ数値上の値
  sea_floor_min_m: -150.0     # m。海底の標高の下限。推定：大陸棚の外縁の水深（〜150 m）
  sea_edge_depth_m: -40.0     # m。海の端（境界）の固定標高。推定：沿岸から数km沖の水深
